<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">TechStore</div>
                
                <div class="nav-links">
                    <a href="#">Trang chủ</a>
                    <a href="#">Sản phẩm</a>
                    <a href="#">Phụ kiện</a>
                    <a href="#">Liên hệ</a>
                </div>

                <button class="hamburger" id="hamburger">
                    <i class="fas fa-bars"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="container">
            <div class="layout">
                <!-- SIDEBAR -->
                <aside class="sidebar">
                    <h3>Bộ lọc</h3>
                    <div class="filter-group">
                        <h4>Thương hiệu</h4>
                        <label><input type="checkbox" checked> Apple</label>
                        <label><input type="checkbox"> Samsung</label>
                        <label><input type="checkbox"> Xiaomi</label>
                        <label><input type="checkbox"> OPPO</label>
                    </div>
                    <div class="filter-group">
                        <h4>Giá</h4>
                        <input type="range" min="0" max="50000000" value="30000000">
                    </div>
                </aside>

                <!-- PRODUCT GRID -->
                <section class="product-section">
                    <h2 class="section-title">Điện Thoại Nổi Bật</h2>
                    <div class="product-grid" id="productGrid">
                        <!-- Products will be generated by JS or static -->
                    </div>
                </section>

                <!-- ADS BAR -->
                <aside class="ads-bar">
                    <div class="ad-card">
                        <h4>Khuyến mãi hot</h4>
                        <img src="https://picsum.photos/300/200?random=1" alt="ads">
                        <p>Giảm đến 40% cho iPhone 15 series</p>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 TechStore. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Tạo 8 product cards
        const products = [
            {name: "iPhone 16 Pro", price: "29.990.000", img: "https://picsum.photos/300/300?random=10"},
            {name: "Samsung Galaxy S25", price: "24.990.000", img: "https://picsum.photos/300/300?random=11"},
            {name: "Xiaomi 14T Pro", price: "12.990.000", img: "https://picsum.photos/300/300?random=12"},
            {name: "OPPO Reno12", price: "11.490.000", img: "https://picsum.photos/300/300?random=13"},
            {name: "iPhone 15", price: "19.990.000", img: "https://picsum.photos/300/300?random=14"},
            {name: "Galaxy A55", price: "8.490.000", img: "https://picsum.photos/300/300?random=15"},
            {name: "Redmi Note 13 Pro", price: "6.990.000", img: "https://picsum.photos/300/300?random=16"},
            {name: "Vivo V30", price: "9.990.000", img: "https://picsum.photos/300/300?random=17"}
        ];

        const grid = document.getElementById('productGrid');
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.img}" alt="${product.name}">
                <div class="product-info">
                    <h4>${product.name}</h4>
                    <p class="price">${product.price} ₫</p>
                    <button class="btn-add">Thêm vào giỏ</button>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
