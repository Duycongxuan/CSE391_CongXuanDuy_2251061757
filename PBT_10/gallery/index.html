<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📸 Photo Gallery</h1>
        <p>Cuộn xuống để tải thêm ảnh (Infinite Scroll & Lazy Load)</p>
    </header>

    <!-- Container chứa lưới ảnh -->
    <main id="gallery" class="gallery-grid"></main>

    <!-- Trigger để bắt sự kiện cuộn tới đáy trang -->
    <div id="load-trigger" class="loading-indicator">
        <div class="spinner"></div>
        <span>Đang tải thêm...</span>
    </div>

    <!-- Lightbox (Modal) để xem ảnh lớn -->
    <div id="lightbox" class="lightbox hidden">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full size">
            <div id="lightbox-loading" class="spinner lightbox-spinner"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
